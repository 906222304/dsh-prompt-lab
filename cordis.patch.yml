# v0.3 沿用原有 ID，切勿重复注册同名实例。
- insert:
    # 后端插件：把配置中的提示词注册为系统提示词段。
    - id: prompt-lab
      name: dsh-prompt-lab
      inject: [systemPrompt]
      config:
        # 置为 false 只关自定义提示词注入；组装观察、过滤与配置编辑仍可用。
        enabled: true
        # 未保存过配置时，使用 lib/default-prompt.js 中的“越狱破甲”。
        # 用户编辑继续保存在 DSH_HOME/prompt-lab/profiles.json，不在重载时覆盖。

    # 独立的本地 HTTP 接口插件：只依赖 webServer，
    # 因此即使 Web 服务不可用，也不会影响上面提示词段的注册。
    - id: prompt-lab-ui
      name: dsh-prompt-lab/ui
      inject: [webServer]

    # AI 能力独立依赖模型服务；缺失时管理与注入继续可用。
    - id: prompt-lab-ai
      name: dsh-prompt-lab/ai
      inject: [llm, agentDefaultModel]
